name: Send push notification

on:
  workflow_dispatch:
    inputs:
      title:
        description: Titre de la notification
        required: true
        type: string
      message:
        description: Texte de la notification
        required: true
        type: string
      url:
        description: Lien ouvert au clic
        required: false
        default: https://www.clairvoyancemedium.com/
        type: string
      image_url:
        description: Image facultative HTTPS
        required: false
        default: ''
        type: string
      target:
        description: Cible
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios_web
      delivery_mode:
        description: Mode de livraison
        required: true
        default: now
        type: choice
        options:
          - now
          - scheduled
          - smart_last_active
          - local_time
      send_after:
        description: Date/heure ISO 8601 pour un envoi programmé
        required: false
        default: ''
        type: string
      delivery_time:
        description: Heure locale HH:MM pour le mode fuseau utilisateur
        required: false
        default: '19:00'
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY || secrets.ONESIGNAL_APP_KEY }}
        shell: bash
        run: |
          test -n "$ONESIGNAL_APP_ID" || (echo 'ONESIGNAL_APP_ID manquant' && exit 1)
          test -n "$ONESIGNAL_API_KEY" || (echo 'Clé API OneSignal manquante : ONESIGNAL_API_KEY ou ONESIGNAL_APP_KEY' && exit 1)

      - name: Send notification with OneSignal
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY || secrets.ONESIGNAL_APP_KEY }}
          PUSH_TITLE: ${{ inputs.title }}
          PUSH_MESSAGE: ${{ inputs.message }}
          PUSH_URL: ${{ inputs.url }}
          PUSH_IMAGE_URL: ${{ inputs.image_url }}
          PUSH_TARGET: ${{ inputs.target }}
          PUSH_DELIVERY_MODE: ${{ inputs.delivery_mode }}
          PUSH_SEND_AFTER: ${{ inputs.send_after }}
          PUSH_DELIVERY_TIME: ${{ inputs.delivery_time }}
        run: python3 scripts/send_push.py
