name: Send push notification

on:
  workflow_dispatch:
    inputs:
      title:
        description: Titre de la notification
        required: true
        type: string
      message:
        description: Texte de la notification
        required: true
        type: string
      url:
        description: Lien ouvert au clic
        required: false
        default: https://www.clairvoyancemedium.com/
        type: string
      image_url:
        description: Image facultative HTTPS
        required: false
        default: ''
        type: string
      target:
        description: Cible
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios_web

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        shell: bash
        run: |
          test -n "$ONESIGNAL_APP_ID" || (echo 'ONESIGNAL_APP_ID manquant' && exit 1)
          test -n "$ONESIGNAL_API_KEY" || (echo 'ONESIGNAL_API_KEY manquant' && exit 1)

      - name: Send notification with OneSignal
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          PUSH_TITLE: ${{ inputs.title }}
          PUSH_MESSAGE: ${{ inputs.message }}
          PUSH_URL: ${{ inputs.url }}
          PUSH_IMAGE_URL: ${{ inputs.image_url }}
          PUSH_TARGET: ${{ inputs.target }}
        run: python3 scripts/send_push.py
