name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'firebase/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_DISABLE_LOCATION: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project, Firebase config and official icon
        shell: bash
        run: |
          rm -rf .build_app
          flutter create --platforms=android --org com.clairvoyancemedium --project-name clairvoyancemedium_app .build_app
          cp pubspec.yaml .build_app/pubspec.yaml
          rm -rf .build_app/lib .build_app/test
          cp -R lib .build_app/lib
          mkdir -p .build_app/assets
          cp firebase/google-services.json .build_app/android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re

          src = Path('assets/app_icon_512.png.b64').read_text(encoding='utf-8')
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', src)
          clean = clean.rstrip('=')
          clean += '=' * (-len(clean) % 4)
          raw = base64.b64decode(clean, validate=False)
          if not raw.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Le fichier du logo decode ne correspond pas a un JPEG valide')
          Path('.build_app/assets/app_icon.jpg').write_bytes(raw)

          cfg = json.loads(Path('.build_app/android/app/google-services.json').read_text(encoding='utf-8'))
          package_name = cfg['client'][0]['client_info']['android_client_info']['package_name']
          expected = 'com.clairvoyancemedium.clairvoyancemedium_app'
          if package_name != expected:
              raise SystemExit(f'Package Firebase inattendu: {package_name} != {expected}')
          print(f'Firebase Android valide pour {package_name}')
          PY

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('.build_app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')

          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )

          text = text.replace(
              'android:label="clairvoyancemedium_app"',
              'android:label="ClairVoyanceMedium.com"',
          )
          manifest.write_text(text, encoding='utf-8')

          settings_kts = Path('.build_app/android/settings.gradle.kts')
          settings_groovy = Path('.build_app/android/settings.gradle')
          app_kts = Path('.build_app/android/app/build.gradle.kts')
          app_groovy = Path('.build_app/android/app/build.gradle')

          if settings_kts.exists():
              s = settings_kts.read_text(encoding='utf-8')
              marker = 'id("com.android.application")'
              if 'com.google.gms.google-services' not in s:
                  s = s.replace(marker, 'id("com.google.gms.google-services") version "4.4.4" apply false\n    ' + marker, 1)
              settings_kts.write_text(s, encoding='utf-8')
          elif settings_groovy.exists():
              s = settings_groovy.read_text(encoding='utf-8')
              marker = "id 'com.android.application'"
              if 'com.google.gms.google-services' not in s:
                  s = s.replace(marker, "id 'com.google.gms.google-services' version '4.4.4' apply false\n    " + marker, 1)
              settings_groovy.write_text(s, encoding='utf-8')

          if app_kts.exists():
              s = app_kts.read_text(encoding='utf-8')
              marker = 'id("com.android.application")'
              if 'com.google.gms.google-services' not in s:
                  s = s.replace(marker, marker + '\n    id("com.google.gms.google-services")', 1)
              app_kts.write_text(s, encoding='utf-8')
          elif app_groovy.exists():
              s = app_groovy.read_text(encoding='utf-8')
              marker = "id 'com.android.application'"
              if 'com.google.gms.google-services' not in s:
                  s = s.replace(marker, marker + "\n    id 'com.google.gms.google-services'", 1)
              app_groovy.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('Fichier Gradle Android introuvable')
          PY

      - name: Install dependencies
        working-directory: .build_app
        shell: bash
        run: |
          flutter pub get
          flutter pub add --dev flutter_launcher_icons

      - name: Generate official launcher icon
        working-directory: .build_app
        shell: bash
        run: |
          cat >> pubspec.yaml <<'EOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/app_icon.jpg"
            min_sdk_android: 23
          EOF
          dart run flutter_launcher_icons
          find android/app/src/main/res -type f -name 'ic_launcher*' -print

      - name: Check Dart code
        working-directory: .build_app
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build universal release APK
        working-directory: .build_app
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        shell: bash
        run: |
          flutter build apk --release \
            --build-name=0.2.1 \
            --build-number=${{ github.run_number }} \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"

      - name: Prepare downloadable APK
        run: cp .build_app/build/app/outputs/flutter-apk/app-release.apk ClairVoyanceMedium.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClairVoyanceMedium-Android
          path: ClairVoyanceMedium.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update permanent Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES='Version Android 0.2.1 reliée au projet Firebase ClairVoyanceMedium, avec logo officiel, WebView du site en temps réel et structure OneSignal. Les notifications deviennent actives dès que ONESIGNAL_APP_ID et la configuration OneSignal/FCM sont terminés.'
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest ClairVoyanceMedium.apk --clobber
            gh release edit android-latest --title 'ClairVoyanceMedium Android' --notes "$NOTES" --latest
          else
            gh release create android-latest ClairVoyanceMedium.apk --title 'ClairVoyanceMedium Android' --notes "$NOTES" --latest
          fi
