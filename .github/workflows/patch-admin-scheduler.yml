name: Patch admin scheduler

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch_admin_scheduler.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin page
        run: python3 scripts/patch_admin_scheduler.py

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          rm -f scripts/patch_admin_scheduler.py .github/workflows/patch-admin-scheduler.yml
          git config user.name "ClairVoyanceMedium"
          git config user.email "contact.clairvoyancemedium@gmail.com"
          git add admin.html scripts/patch_admin_scheduler.py .github/workflows/patch-admin-scheduler.yml
          if git diff --cached --quiet; then
            echo "Aucune modification à valider"
            exit 0
          fi
          git commit -m "Active la programmation intelligente dans le tableau de bord"
          git push
