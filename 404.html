<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <meta name="robots" content="noindex">
  <title>ClairVoyanceMedium.com</title>
  <style>
    :root{--bg:#070707;--gold:#d7ad4a;--gold2:#f4da87;--text:#f7f4ec;--muted:#aaa49a;--line:#352c1d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% -10%,rgba(215,173,74,.18),transparent 35%),#070707}
    .card{width:min(620px,100%);border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#151515,#0b0b0b);box-shadow:0 24px 70px rgba(0,0,0,.5);padding:32px 22px;text-align:center}
    .logo{width:92px;height:92px;border-radius:22px;object-fit:cover;border:1px solid #725b27;background:#111}
    .eyebrow{margin-top:14px;color:var(--gold2);font-size:12px;text-transform:uppercase;letter-spacing:1.6px}
    h1{font-size:clamp(28px,7vw,44px);margin:8px 0 10px}
    p{color:var(--muted);line-height:1.55;margin:0 auto 22px;max-width:500px}
    .actions{display:grid;gap:10px}
    .btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 16px;border-radius:13px;text-decoration:none;font-weight:800;border:1px solid #5d4a22;background:#14110b;color:var(--gold2)}
    .btn.primary{background:linear-gradient(135deg,#e2bb5c,#a77b1f);border-color:#dbb354;color:#0b0905}
    .small{margin-top:18px;color:#716d65;font-size:11px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/app-clairvoyancemedium.github.io/assets/app_icon.png" alt="ClairVoyanceMedium.com">
    <div class="eyebrow">ClairVoyanceMedium.com</div>
    <h1>Bienvenue</h1>
    <p>Cette adresse n’est plus disponible ou a été déplacée. Vous pouvez continuer directement vers l’application officielle ou vers le site ClairVoyanceMedium.com.</p>
    <div class="actions">
      <a class="btn primary" href="/app-clairvoyancemedium.github.io/">Installer l’application</a>
      <a class="btn" href="https://www.clairvoyancemedium.com/">Accéder au site officiel</a>
    </div>
    <div class="small">Application officielle ClairVoyanceMedium.com</div>
  </main>
</body>
</html>
